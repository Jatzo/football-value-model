[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "football-value-model"
version = "0.1.0"
description = "Dixon-Coles football model that compares its prices with bookmaker odds and backtests them honestly"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jatzo" }]
dependencies = [
    "httpx>=0.27",
    "flask>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "scipy>=1.12",
]

[project.urls]
Repository = "https://github.com/Jatzo/footballbetfinder"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
valuemodel = "valuemodel.cli:main"

[tool.setuptools.packages.find]
include = ["valuemodel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.setuptools.package-data]
valuemodel = ["web/templates/*.html", "web/static/*"]
